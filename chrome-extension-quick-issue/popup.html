<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Issue</title>
  <style>
    * {
      box-sizing: border-box;
    }
    
    body {
      width: 400px;
      min-height: 300px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      background: #f6f8fa;
    }
    
    h1 {
      margin: 0 0 16px 0;
      font-size: 16px;
      color: #24292f;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    h1::before {
      content: '📝';
    }
    
    .form-group {
      margin-bottom: 12px;
    }
    
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 600;
      color: #24292f;
    }
    
    textarea {
      width: 100%;
      min-height: 120px;
      padding: 8px 12px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      resize: vertical;
    }
    
    textarea:focus {
      outline: none;
      border-color: #0969da;
      box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.1);
    }
    
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
    }
    
    input:focus {
      outline: none;
      border-color: #0969da;
      box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.1);
    }
    
    .context-box {
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 12px;
      font-size: 12px;
      color: #57606a;
    }
    
    .context-box strong {
      color: #24292f;
    }
    
    .context-box .url {
      word-break: break-all;
      color: #0969da;
    }
    
    button {
      width: 100%;
      padding: 10px 16px;
      background: #2da44e;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    button:hover {
      background: #2c974b;
    }
    
    button:disabled {
      background: #94d3a2;
      cursor: not-allowed;
    }
    
    .settings-toggle {
      background: none;
      border: none;
      color: #57606a;
      font-size: 12px;
      cursor: pointer;
      padding: 4px 0;
      width: auto;
      margin-bottom: 12px;
    }
    
    .settings-toggle:hover {
      color: #24292f;
      background: none;
    }
    
    .settings {
      display: none;
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 12px;
    }
    
    .settings.visible {
      display: block;
    }
    
    .status {
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }
    
    .status.success {
      display: block;
      background: #dafbe1;
      color: #116329;
    }
    
    .status.error {
      display: block;
      background: #ffebe9;
      color: #cf222e;
    }
    
    .status a {
      color: inherit;
      font-weight: 600;
    }
    
    .type-selector {
      display: flex;
      gap: 12px;
    }
    
    .type-option {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      cursor: pointer;
      font-weight: normal;
      transition: all 0.2s;
    }
    
    .type-option:has(input:checked) {
      border-color: #0969da;
      background: #ddf4ff;
    }
    
    .type-option input {
      width: auto;
      margin: 0;
    }
    
    .include-context {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    
    .include-context input {
      width: auto;
    }
    
    .generated-title {
      font-size: 12px;
      color: #57606a;
      margin-top: 4px;
      font-style: italic;
    }
    
    .screenshot-section {
      margin-bottom: 12px;
    }
    
    .screenshot-buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    
    .screenshot-buttons button {
      flex: 1;
      padding: 8px 12px;
      background: #0969da;
      font-size: 12px;
    }
    
    .screenshot-buttons button:hover {
      background: #0860ca;
    }
    
    .screenshot-preview {
      position: relative;
      display: none;
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 8px;
    }
    
    .screenshot-preview.visible {
      display: block;
    }
    
    .screenshot-preview img {
      max-width: 100%;
      border-radius: 4px;
    }
    
    .screenshot-preview .remove-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 24px;
      height: 24px;
      padding: 0;
      background: #cf222e;
      border-radius: 50%;
      font-size: 14px;
      line-height: 1;
    }
    
    .screenshot-preview .remove-btn:hover {
      background: #a40e26;
    }
    
    .screenshot-hint {
      font-size: 11px;
      color: #57606a;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h1>Quick Issue</h1>
  
  <div class="context-box" id="contextBox">
    <strong>Page:</strong> <span id="pageTitle">Loading...</span><br>
    <strong>URL:</strong> <span class="url" id="pageUrl">Loading...</span>
  </div>
  
  <div class="screenshot-section">
    <label>Screenshot (optional)</label>
    <div class="screenshot-buttons">
      <button type="button" id="captureTab">📷 Capture Tab</button>
      <button type="button" id="selectRegion">✂️ Select Region</button>
    </div>
    <div class="screenshot-preview" id="screenshotPreview">
      <button type="button" class="remove-btn" id="removeScreenshot">×</button>
      <img id="screenshotImg" src="" alt="Screenshot">
    </div>
    <div class="screenshot-hint">Screenshot will be uploaded to Imgur and embedded in the issue</div>
  </div>
  
  <div class="form-group">
    <label>Type</label>
    <div class="type-selector">
      <label class="type-option">
        <input type="radio" name="issueType" value="Bug" checked>
        <span>🐛 Bug</span>
      </label>
      <label class="type-option">
        <input type="radio" name="issueType" value="Enhancement">
        <span>✨ Enhancement</span>
      </label>
    </div>
  </div>
  
  <label class="include-context">
    <input type="checkbox" id="includeContext" checked>
    Include page context in issue
  </label>
  
  <div class="form-group">
    <label for="body">Issue Description</label>
    <textarea id="body" placeholder="Describe the issue, bug, or feature request...&#10;&#10;A title will be auto-generated from the first line or sentence."></textarea>
    <div class="generated-title" id="generatedTitle"></div>
  </div>
  
  <button type="button" class="settings-toggle" id="settingsToggle">⚙️ Settings</button>
  
  <div class="settings" id="settings">
    <div class="form-group">
      <label for="repoOwner">Repository Owner</label>
      <input type="text" id="repoOwner" placeholder="e.g., octocat">
    </div>
    <div class="form-group">
      <label for="repoName">Repository Name</label>
      <input type="text" id="repoName" placeholder="e.g., my-project">
    </div>
    <div class="form-group">
      <label for="projectId">Project ID (optional)</label>
      <input type="text" id="projectId" placeholder="e.g., PVT_kwDOxxxxxx">
      <div style="font-size: 11px; color: #57606a; margin-top: 4px;">
        Leave empty to skip adding to project
      </div>
    </div>
    <div class="form-group">
      <label for="token">GitHub Personal Access Token</label>
      <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx">
      <div style="font-size: 11px; color: #57606a; margin-top: 4px;">
        Requires repo and project scopes. <a href="https://github.com/settings/tokens/new?scopes=repo,project&description=Quick%20Issue" target="_blank">Create token</a>
      </div>
    </div>
  </div>
  
  <button type="button" id="submit">Create Issue</button>
  
  <div class="status" id="status"></div>
  
  <script src="popup.js"></script>
</body>
</html>
